name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install deps
        run: uv sync --dev
      - name: Format check
        run: uv run black --check src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest
